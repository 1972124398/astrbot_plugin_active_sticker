<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主动表情面板</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header class="panel-header">
    <h1>主动表情</h1>
    <div class="tabs" role="tablist" aria-label="主动表情">
      <button id="library-tab" type="button" role="tab" aria-selected="true" aria-controls="library-panel">表情库</button>
      <button id="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="settings-panel" tabindex="-1">设置</button>
    </div>
  </header>
  <section id="library-panel" role="tabpanel" aria-labelledby="library-tab">
    <section class="pack-section" aria-label="风格包">
      <div class="pack-heading"><div><p class="eyebrow">按风格整理 · 按语境表达</p><h2>我的风格包</h2></div><button id="new-pack" class="primary" type="button">＋ 新建风格包</button></div>
      <p class="muted">把同一角色、画风的图片放进一包。短期对话只用一个包；空闲后，下次聊天才可能换包。</p>
      <div id="pack-list" class="pack-list"></div>
      <div class="pack-heading"><p id="pack-detail" class="muted"></p><div class="actions"><button id="edit-pack" type="button" hidden>管理此包</button><button id="export-pack" type="button" hidden>打包下载</button></div></div>
    </section>
    <header class="library-header">
      <div>
        <p id="counts" class="muted" aria-live="polite">正在读取表情库…</p>
      </div>
      <div class="actions">
        <button id="export-csv" type="button">导出全库 CSV</button>
        <button id="export-documents" type="button">导出图库文档 ZIP</button>
        <button id="export" type="button">下载描述目录</button>
        <button id="retry" type="button">识别待处理图片</button>
      </div>
    </header>
    <div id="vision-hint" class="vision-hint" hidden>
      <span>设置可用的识图模型后，待识图的图片会自动处理。</span>
      <button id="open-settings" type="button">前往设置</button>
    </div>
    <button id="drop" type="button">
      <strong>导入表情包</strong>
      <span>拖入图片或点击批量选择 · PNG、JPEG、GIF、WebP</span>
    </button>
    <input id="files" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
    <label class="import-target">导入到 <select id="import-pack" aria-label="导入到风格包"></select></label>
    <p id="notice" class="notice" role="status" hidden></p>
    <section class="toolbar" aria-label="筛选表情">
      <input id="search" type="search" placeholder="搜索文件名、描述或标签" aria-label="搜索表情">
      <select id="status" aria-label="按状态筛选">
        <option value="">全部状态</option>
        <option value="ready">可使用</option>
        <option value="waiting">待识图</option>
        <option value="disabled">已停用</option>
      </select>
      <select id="category" aria-label="按用途筛选"><option value="">全部表达用途</option></select>
    </section>
    <section class="organize-bar" aria-label="批量整理">
      <label class="check"><input id="select-all" type="checkbox">选择筛选结果</label><span id="selected-count" aria-live="polite">已选 0 张</span>
      <select id="move-pack" aria-label="移动到风格包"></select><button id="move-selected" type="button">移动</button>
      <button id="enable-selected" type="button">启用</button><button id="disable-selected" type="button">停用</button><button id="clear-selected" type="button">清空选择</button>
    </section>
    <div id="gallery" class="gallery"></div>
    <p id="empty" class="empty" hidden></p>
    <button id="more" type="button" hidden>显示更多</button>
  </section>
  <section id="settings-panel" class="settings" role="tabpanel" aria-labelledby="settings-tab" hidden>
    <div id="settings-fields" hidden>
      <fieldset>
        <legend>模型</legend>
        <div class="model-fields">
          <label>识图模型
            <select id="vision_provider_id" aria-describedby="vision-help"></select>
            <small id="vision-help">用于建库，选择支持图片输入的模型。</small>
          </label>
          <label>表情判断模型
            <select id="expression_provider_id"></select>
            <small>用于决定何时发表情以及发哪张。</small>
          </label>
        </div>
        <p id="provider-note" class="muted" hidden>请先在 AstrBot 添加聊天模型，再回来选择。</p>
      </fieldset>
      <fieldset>
        <legend>表情习惯</legend>
        <label class="check"><input id="auto-enabled" type="checkbox">启用自动表情</label>
        <label>补充表情习惯
          <textarea id="expression_style" rows="3" placeholder="例如，和熟人笑场时会连发几张。"></textarea>
        </label>
        <label class="burst-setting">单次连发上限
          <input id="burst_limit" type="number" min="1" max="20" step="1" required aria-describedby="burst-help">
          <small id="burst-help">实际发几张由人格和聊天场景决定。</small>
        </label>
      </fieldset>
      <fieldset>
        <legend>风格保持</legend>
        <div class="model-fields">
          <label>刷新所需空闲时间（小时）<input id="pack_idle_hours" type="number" min="0.0166666667" max="168" step="any" required><small>默认 6 小时。连续聊天保持原包；空闲满此时间，下次对话才尝试换包。</small></label>
          <label>更换概率（%）<input id="pack_switch_percent" type="number" min="0" max="100" step="1" required><small>默认 50%。0 为保持，100 为有其他可用包时必换。</small></label>
        </div>
        <small>每个会话、人格分别保持风格。当前包没有贴切素材时，AI 可以不发表情。</small>
      </fieldset>
      <fieldset>
        <legend>可选联动</legend>
        <label class="check"><input id="interop_enabled" type="checkbox">启用插件联动</label>
        <label class="check peer-toggle"><input id="link_short_term_mood" type="checkbox">短期共享情绪</label>
        <label class="check peer-toggle"><input id="link_self_cognition" type="checkbox">自主认知</label>
      </fieldset>
    </div>
    <div class="settings-footer">
      <p id="settings-status" role="status" aria-live="polite"></p>
      <button id="settings-retry" type="button" hidden>重试读取</button>
      <button id="settings-save" type="button" class="primary" disabled>保存设置</button>
    </div>
  </section>
</main>
<dialog id="editor">
  <div id="edit-form">
    <div class="editor-head"><h2 id="image-name"></h2><button id="close" type="button" aria-label="关闭">×</button></div>
    <div id="editor-picture" class="picture"></div>
    <label>图片名称 <input id="edit-name" maxlength="160" required></label>
    <label>所属风格包 <select id="edit-item-pack"></select></label>
    <label>画面与语气 <textarea id="description" rows="3" maxlength="480"></textarea></label>
    <label>适合怎么回 <textarea id="usage" rows="3" maxlength="400"></textarea></label>
    <label>标签 <input id="tags" placeholder="用逗号分隔"></label>
    <label>表达用途 <input id="categories" list="category-names" placeholder="如 开心、调侃，可选多个"></label>
    <datalist id="category-names"></datalist>
    <label class="check"><input id="enabled" type="checkbox">参与自动选图</label>
    <div class="actions footer">
      <button id="delete" type="button" class="danger">删除</button>
      <button id="identify" type="button">重新识图</button>
      <button id="save" class="primary" type="button">保存</button>
    </div>
    <div id="delete-confirmation" class="delete-confirmation" hidden>
      <p>删除这张图片及其描述？</p>
      <div class="actions">
        <button id="cancel-delete" type="button">取消</button>
        <button id="confirm-delete" type="button" class="danger">确认删除</button>
      </div>
    </div>
    <p id="edit-error" role="alert" hidden></p>
  </div>
</dialog>
<dialog id="pack-editor">
  <div id="pack-form" class="pack-form">
    <div class="editor-head"><h2 id="pack-editor-title">新建风格包</h2><button id="close-pack" type="button" aria-label="关闭">×</button></div>
    <label>名称<input id="pack-name" maxlength="60" required placeholder="例如：猫猫日常、像素小人"></label>
    <label>风格说明<textarea id="pack-description" rows="3" maxlength="300" placeholder="方便自己整理和辨认风格"></textarea></label>
    <label class="check"><input id="pack-enabled" type="checkbox" checked>参与对话选包</label>
    <p class="muted">停用后保留所有图片。删除包会将图片移回「未分组」。</p>
    <div class="actions footer"><button id="delete-pack" type="button" class="danger" hidden>删除风格包</button><button id="save-pack" class="primary" type="button">保存</button></div>
    <div id="pack-delete-confirmation" class="delete-confirmation" hidden><span>将图片移回未分组并删除此包？</span><button id="cancel-delete-pack" type="button">取消</button><button id="confirm-delete-pack" type="button" class="danger">确认删除包</button></div>
    <p id="pack-error" class="danger" role="alert" hidden></p>
  </div>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
